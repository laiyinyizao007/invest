name: Research Guard
# 研究侧(毕昇工作流 / DSH Preset / research-mcp / 带外批准进程)的**语法、静态检查与边界测试**关卡。
#
# 为什么要有这个 job:第 8 轮 codex 复核期间,tools/research_mcp/server.py 带着一处
# SyntaxError(`except/elif` 写在 try 里)进了工作树,整个 MCP 模块 import 不了,
# 而当时仓库里**没有任何 job 会跑 ruff 或 compileall**——ruff 本身能报它,只是没人跑。
#
# 为什么不直接跑 `pytest tests/`:整套测试里有大量用例要交易栈(vnpy)。
# 研究侧那几份已经与交易栈解耦(见下面「边界闸门」步骤的说明),只跑它们——跑得轻、失败得准。
# 需要交易栈的用例会**跳过**,所以这一步在只装 pytest + mcp SDK 的 runner 上也是绿的。
#
# 第 7 轮 codex 的 High:边界不变量(批准记录只有一个写入者 / Preset 不挂危险工具 /
# 工具目录恰为三项 / 研究栈不 import vnpy)**写成了测试却没有任何 job 会跑它**,
# 于是"看起来有防线、实际随时能改坏"。这里把它们纳入闸门。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 连续推送时只跑最新一次:闸门是"有没有坏"的判据,不是"跑了几次"的账本
# (第 10 轮 codex 的 Low)。
concurrency:
  group: research-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 —— **必须**:默认的浅克隆(fetch-depth: 1)在 `pull_request`
          # 事件下只检出 `refs/pull/N/merge`,**没有 origin/main 这个引用**,
          # 后面那步「按后果域分档」跑 `git diff origin/main...HEAD` 会 rc=128 →
          # 分档器 fail-closed 退出 2 → **CI 永久变红**(codex 第 2 轮的 Critical-1)。
          # 完整历史也让那一步能真的比对出改动。
          # 与 constitution-guard.yml 同一条口径(它也需要完整历史)。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # 3.12 起「无效转义」才是 SyntaxWarning;3.11 上它只是 DeprecationWarning,
          # `-W error::SyntaxWarning` 在 3.11 上是空操作(第 10 轮 codex 的 High:
          # 闸门注释承诺的检查在 CI 上根本没生效)。
          python-version: '3.12'

      # 语法关卡:整个仓库都要能编译。-W error::SyntaxWarning 让无效转义也算失败
      # (无效转义是「这行字面量其实不是你以为的那个」的常见来源)。
      # 路径清单要覆盖**研究闭包**里的全部目录:研究侧会 import dashboard/safe.py、
      # notify/redact.py、risk/constitution.py,它们不在 scripts/tools/tests 之下
      # (第 10 轮 codex 的 Medium)。
      #
      # 这是**预防网**,不是保证:它只保证「现在这个提交里的这些文件能编译」。
      # 别把它当成「已经修好的缺陷」的证明——它拦的是**下一次**同类问题。
      # -f:强制重编译,不复用上一次的 .pyc(缓存命中时坏文件可能蒙混过关)。
      # `.github` 也在清单里(仓库自带两个脚本):第 12 轮 codex 的 L4——
      # 注释承诺的是「整个仓库都要能编译」,清单却漏了这一处。
      - name: 语法编译(研究闭包全部目录,含告警即失败)
        run: python -W error::SyntaxWarning -m compileall -qf scripts tools tests dashboard risk notify strategies trading ctp_tools evidence .github

      # ruff 的**清单是显式的**,不是 `ruff check .`:仓库里还留着大量与本研究侧
      # 无关的历史脚本(penetration_check / collect_reject_texts / unattended_report …),
      # 它们各有 3~25 条存量风格债,一次性清理会把本 issue 的改动撑大好几倍。
      # 清单覆盖:研究侧全部模块、本 issue 改过的文件、宪法守卫工具本身,
      # 以及研究闭包里的 risk/ 与 notify/(第 10 轮 codex 的 Medium:清单漏了它们)。
      # dashboard/ 只有 safe.py 与 __init__.py 进了 ruff(其余文件各有 5 条与本研究无关的
      # 存量风格债 F841/E741/F541,清债不属于本 issue);evidence/ 只进了 compileall。
      - name: 静态检查(研究侧与本 issue 涉及的文件)
        run: |
          python -m pip install --quiet ruff==0.14.8
          python -m ruff check \
            scripts/research_api.py \
            scripts/research_approval_server.py \
            scripts/research_config.py \
            scripts/research_console.py \
            scripts/research_gate.py \
            scripts/research_gateway.py \
            scripts/research_grid.py \
            scripts/research_sandbox.py \
            scripts/segment_windows.py \
            scripts/segment_ledger.py \
            scripts/optimize.py \
            tools/research_mcp \
            tools/bisheng/build_v3.py \
            tools/bisheng/bs.py \
            tools/check_constitution_history.py \
            tools/check_domain.py \
            tools/verdict_graph.py \
            tools/check_mutations.py \
            tools/build_trading_calendar.py \
            dashboard/__init__.py \
            dashboard/safe.py \
            notify \
            risk \
            tests/test_check_domain.py \
            tests/test_dashboard_app.py \
            tests/test_dashboard_collect_more.py \
            tests/test_constitution_round11.py \
            tests/test_constitution_round12.py \
            tests/test_research_api.py \
            tests/test_research_approval_server.py \
            tests/test_research_boundary.py \
            tests/test_research_config.py \
            tests/test_research_gate.py \
            tests/test_research_gateway.py \
            tests/test_research_grid.py \
            tests/test_research_mcp.py \
            tests/test_research_sandbox.py \
            tests/test_segment_ledger.py \
            tests/test_sessions.py \
            tests/test_build_trading_calendar.py \
            tests/test_roll.py \
            tests/test_holdout_guard.py \
            tests/test_tick_filter.py \
            tests/test_accounting.py \
            tests/test_heartbeat.py

      # 边界闸门(第 7 轮 codex 的 C1/H1):**先单跑边界不变量那一份**,再跑其余研究侧测试。
      #
      # 为什么要拆成两步:同一个 pytest 调用里只要有一个文件在**收集阶段**报错
      # (比如模块级 import 了交易栈),整轮 session 就中止、**一个测试都不会跑**——
      # 闸门看上去配好了,实际一次都没执行过(仓库里 constitution-guard.yml 的注释
      # 已经记过同一个教训,这里不重犯)。拆开之后,边界不变量那一层永远先跑。
      #
      # 为什么这里能跑研究侧测试:研究侧与交易栈已经解耦——
      #   - scripts/segment_windows.py:窗口常量(纯数据),不再经 optimize → bootstrap → vnpy;
      #   - scripts/segment_ledger.py:不再 import bootstrap,于是全局 conftest 也不碰 vnpy
      #     (**不用** --noconftest:那样会丢掉 conftest 里隔离测试段登记文件的夹具,
      #     本地按这条命令跑就会污染仓库真实的 config/test_segment_usage.json);
      #   - 需要交易栈的用例(vnpy_ctastrategy 等)在没有交易栈时**跳过**,不是失败。
      - name: 研究侧边界不变量(批准唯一写入者 / Preset 边界 / 工具目录 / 不 import vnpy)
        run: |
          # 依赖**从 requirements-research.txt 装**,不在这儿重复写一遍 pin
          # (第 12 轮 codex 的 L5:声明的依赖与被测的依赖长期不一致,
          #  改了这个文件 CI 却不会发现)。pytest 单独钉版本(它不在那个文件里)。
          python -m pip install --quiet -r requirements-research.txt pytest==8.3.4
          python -m pytest -p no:cacheprovider -q tests/test_research_boundary.py

      - name: 研究侧其余测试(沙盒/网关/批准进程/MCP/配置/分档器)
        run: |
          # `--continue-on-collection-errors`:某个文件在**收集阶段**报错时,pytest 会以退出码 4 结束,
          # 但**其余文件仍然要跑**(第 11 轮 codex 的 F9)。不加这个开关,一个文件坏掉就把这一整步的
          # 研究侧测试全废掉——闸门看上去配好了,实际没跑几个。
          #
          # test_check_domain.py 也在这里:分档器是**流程闸门**,它自己的清单一旦失准
          # (把执行域文件误判成研究域),后面所有分档都会跟着错。它只依赖标准库 +
          # git,不装交易环境也能跑(第 12 轮 codex 的教训:依赖声明与实际依赖必须一致)。
          python -m pytest -p no:cacheprovider --continue-on-collection-errors -q \
            tests/test_check_domain.py \
            tests/test_research_config.py \
            tests/test_research_sandbox.py \
            tests/test_research_gateway.py \
            tests/test_research_approval_server.py \
            tests/test_research_api.py \
            tests/test_research_mcp.py \
            tests/test_research_gate.py \
            tests/test_research_grid.py \
            tests/test_sessions.py \
            tests/test_build_trading_calendar.py \
            tests/test_roll.py \
            tests/test_holdout_guard.py \
            tests/test_tick_filter.py \
            tests/test_accounting.py \
            tests/test_heartbeat.py

      # 后果域分档器**自己**的冒烟关卡(codex 第 1 轮的 M4、第 2 轮的 Critical-1)。
      #
      # 为什么要有这一步:上面那一步只是**测**分档器(单元测试 + 探针),
      # 但分档器作为 CLI 的那条路径——`--diff` 读 git、打印中文档位、
      # 按退出码表态——**没有任何 CI 跑过**。而 CLAUDE.md 文档里给出的命令
      # 正是这条路径(codex 的 M5:它在 Windows cp1252 控制台上直接崩,
      # 退出码变成 1,与「判为执行域」无法区分)。
      #
      # 这一步跑的是**真实 CLI**:非 UTF-8 控制台下不得崩溃、退出码语义必须对得上。
      #
      # **退出码语义**(三条,互不重叠):
      #   0 = 全部研究域,**或**本次没有改动;
      #   1 = 含执行域文件(该走完整流程);
      #   2 = 环境不可用(fail-closed)——**只有这一种**该让关卡失败。
      # 第 2 轮复核指出:若把「没有改动」也算 2,push 到 main 时(base==HEAD、
      # 工作树干净)就会**永久变红**。已把「没有改动」分出来,返回 0。
      - name: 后果域分档器冒烟(非 UTF-8 控制台 + 退出码 + 输出自证)
        run: |
          set -e
          # PYTHONIOENCODING=cp1252 复现 Windows 默认控制台:崩了就红。
          PYTHONIOENCODING=cp1252 python tools/check_domain.py scripts/optimize.py
          # 按本次 PR 的改动分档。0 与 1 都是**正常**结果(1 = 含执行域文件,
          # 该走完整流程——这里只要求命令能跑通,不做流程判定)。
          # 2 = 环境不可用(fail-closed),那才是失败。
          rc=0
          out=$(python tools/check_domain.py --diff "origin/${{ github.base_ref || 'main' }}" 2>&1) || rc=$?
          echo "$out"
          if [ "$rc" = "2" ]; then
            echo "分档器返回 2(环境不可用)——按 fail-closed 处理,本关卡失败"; exit 1
          fi
          # **必须看到「总判定:」这一行**,否则不能算「它给出了判断」。
          # 只看退出码是不够的:Sourcery 复核抓到过一个 fail-open 口子——
          # Python 遇到未捕获异常时退出码也是 **1**,而 1 在本工具的语义里
          # 是「判为执行域」(正常结果)。于是「分档器自己崩了」与
          # 「分档器说这是执行域」在 CI 眼里完全一样,崩了也照样放行。
          # 两道防线:①CLI 现在把未预期异常归到 2(见 tools/check_domain.py::_cli);
          # ②这里再要求输出里有结论行,崩了就没有。
          if ! echo "$out" | grep -q "总判定:"; then
            echo "分档器没有给出判定结论(崩溃?退出码=$rc)——按 fail-closed 处理,本关卡失败"; exit 1
          fi
          echo "分档器退出码=$rc(0/1 均正常;2 才是环境不可用)"
          exit 0

      # 变异验证(codex 第 2 轮的 M3):分档清单的每次改动都必须被测试抓住。
      #
      # 为什么要有这一步:ADR 里那张「N 种变异全部被抓住,条数实测」的表,
      # 第 1 轮复核就发现**三行数字对不上**(测试从 82 条长到 90 条,
      # 红的用例集自然变了),而且有一行**变异描述写反了**。
      # 靠人记的数字会过期 —— 这条关卡把它变成机器保证:
      # 脚本在**仓库副本**上逐个施加变异、数 pytest 的 FAILED 行数,
      # 任何一种变异没被抓住就红。`--verify` 还会核对 ADR 表格里的数字。
      #
      # 注意它在**副本**里做(真工作树全程不动),所以跑起来慢一点是应该的。
      - name: 分档清单的变异验证(每个清单改动都必须被抓住)
        run: |
          python tools/check_mutations.py --verify
