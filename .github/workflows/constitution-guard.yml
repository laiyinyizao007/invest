name: Constitution Guard
# 不可变宪法清单的"只能追加"靠版本控制保证:每次提交后的清单相对上一次只能增不能减。
# 这个检查需要**完整历史**,所以必须 fetch-depth: 0——浅克隆下 git log 只看得到一个提交,
# 检查会"看起来通过"实则根本没比对,所以守卫对浅克隆是 fail-closed(直接失败)。
#
# 守卫本体是 tools/check_constitution_history.py:只用标准库 + git,**不依赖 pytest,也不依赖 vnpy**。
# 早先这里跑 pytest tests/test_constitution.py,但 pytest 的 conftest 会 import
# segment_ledger → bootstrap → vnpy,在只装 pytest 的 CI 上直接收集失败(退出码 4)——
# 守卫于是在 CI 上一次都没跑过,却看起来"配好了"(第 6 轮 codex 实测)。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  constitution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # 完整历史:否则"只能追加"的比对无从谈起

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 宪法层是纯标准库 + git:这里不需要装 pytest,更不需要装整个交易环境。
      #
      # 【第 55 轮之四】接线自检的**独立落点**就在**这一步**里:
      # `tools/check_constitution_history.py` 里有一条**纯文本**的检查
      # (`check_ci_wiring_presence`)——它断言
      # 「`.github/workflows/research-guard.yml` 里必须**还在**跑
      # `python tools/check_ci_wiring.py`(规范形:一个选项都不许带)」。
      #
      # **为什么不另开一个步骤**:接线自检要读 workflow 的 YAML ⇒ 需要 PyYAML ⇒
      # 宪法层就得 `pip install` ⇒ 违反「宪法层是纯标准库」这条约定
      # (仓库里 `tests/test_constitution.py` 就钉着它:宪法层不许装交易环境依赖)，
      # 而且**给一个「守卫会不会跑」的判断加上网络依赖**本身就是倒退。
      # 纯文本核对**不需要任何依赖** ⇒ 放在这个工具里,宪法 workflow 一个依赖都不装。
      - name: Check the constitution is append-only
        run: python tools/check_constitution_history.py
